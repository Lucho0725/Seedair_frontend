<div class="page-container">

    <div class="header-row">
        <div class="title-section">
            <h2>Lista de Marcas</h2>
            <p class="subtitle">Administra los fabricantes de equipos registrados en el catálogo.</p>
        </div>
        
        <button mat-flat-button color="primary" routerLink="/drone/drone-brands/save-drone-brand">
            <mat-icon>add</mat-icon>Nueva Marca
        </button>
    </div>

    <div class="search-row">
        <mat-form-field appearance="outline" class="search-box">
            <mat-label>Buscar marca</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ej: DJI, Autel, Parrot..." #input>
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
    </div>

    <div class="table-container">
        <table mat-table [dataSource]="dsListaMarcas" class="mat-elevation-z2">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef style="width: 100px;"> Id </th>
                <td mat-cell *matCellDef="let element"> 
                    <strong>{{element.id}}</strong> 
                </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Nombre de Marca </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <ng-container matColumnDef="opciones">
                <th mat-header-cell *matHeaderCellDef style="text-align: right;"> Opciones </th>
                <td mat-cell *matCellDef="let element" style="text-align: right;"> 
                    <button mat-icon-button color="primary" routerLink="/drone/drone-brands/save-drone-brand/{{element.id}}" matTooltip="Editar Marca">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="Eliminar(element.id)" matTooltip="Eliminar Marca">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>
            
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell empty-state" colspan="3">
                    No se encontraron marcas que coincidan con "{{input.value}}"
                </td>
            </tr>
        </table>
    </div>
</div>
