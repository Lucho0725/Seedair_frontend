<mat-toolbar class="general">
  
  <div class="header-logo" routerLink="/home">
    <span class="logo-title">Seed Air</span>
  </div>

  <div class="header-nav">
    
    <ng-container *ngIf="isAdmin">
      <a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/drone/list-drones-admin" routerLinkActive="active-link">Drones</a>
      <a routerLink="/operators/list-operators" routerLinkActive="active-link">Operadores</a>
    </ng-container>

    <ng-container *ngIf="isLoggedIn && !isAdmin">
      <a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/parcels/list-parcels" routerLinkActive="active-link">Mis Parcelas</a>
      <a routerLink="/drone/list-drone" routerLinkActive="active-link">Catálogo de Drones</a>
      <a routerLink="/reservations/list-customer-reservations" routerLinkActive="active-link">Mis Reservas</a>
    </ng-container>

    <ng-container *ngIf="!isLoggedIn">
      <a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Servicios</a>
      <a routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Cómo funciona</a>
      <a routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Nosotros</a>
    </ng-container>

  </div>

  <span class="example-spacer"></span>

  <div class="header-actions">
    
    <a *ngIf="!isLoggedIn" routerLink="/login" class="btn-login" routerLinkActive="active-link">
      Login
    </a>
    
    <a *ngIf="isLoggedIn" routerLink="" class="btn-user-icon" title="Mi Perfil">
      <mat-icon>account_circle</mat-icon> 
    </a>
    
    <button *ngIf="!isAdmin" class="btn-request" routerLink="/reservations/save-reservation">
      Solicitar servicio
    </button>
    
    <a *ngIf="isLoggedIn" (click)="Logout()" class="btn-logout-icon" title="Cerrar Sesión">
      <mat-icon>logout</mat-icon>
    </a>
    
  </div>

</mat-toolbar>
